name: Publish compatibility releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-releases.yml"
      - "AirCard17/**"
      - "AirCard17.xcodeproj/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios17:
    name: Build and publish iOS 17 legacy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned iOS 17 IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project AirCard17.xcodeproj \
            -scheme AirCard17 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          app="build/Build/Products/Release-iphoneos/AirCard17.app"
          test -d "$app"
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry AirCard17-iOS17.ipa Payload

      - name: Publish iOS 17 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios17-legacy
          name: AirCard17 — iOS 17 Legacy
          body: |
            Last working iOS 17 build. Use this release only on iOS 17.x.
            iOS 18–26 users should install the Airlift pairing build instead.
          prerelease: false
          make_latest: false
          files: AirCard17-iOS17.ipa

  ios26:
    name: Build and publish iOS 18-26 Airlift with legacy UI
    runs-on: macos-15
    steps:
      - name: Check out AirCard17
        uses: actions/checkout@v4

      - name: Check out Airlift backend
        run: git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git airlift

      - name: Overlay legacy AirCard17 UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          airlift = root / "airlift"
          legacy = root / "AirCard17" / "AirCard17"

          # Keep the modern Airlift engine and append the legacy community/catalog
          # views to a compiled source file so no project-file regeneration is needed.
          content = airlift / "ios-app" / "ContentView.swift"
          additions = []
          for name in ("CommunityView.swift", "ImagePicker.swift", "LanguageManager.swift", "GitHubService.swift"):
              source = legacy / name
              text = source.read_text(encoding="utf-8-sig")
              text = "\n".join(line for line in text.splitlines() if not line.startswith("import "))
              additions.append("\n\n// Legacy AirCard17 UI overlay: " + name + "\n" + text)
          content.write_text(content.read_text(encoding="utf-8") + "".join(additions), encoding="utf-8")

          models = airlift / "ios-app" / "Models.swift"
          text = models.read_text(encoding="utf-8")
          text = text.replace(
              'case pairing = "Pairing"\n    case walletCards = "Wallet Cards"',
              'case walletCards = "Wallet Cards"\n    case community = "Community"\n    case pairing = "Pairing"'
          )
          models.write_text(text, encoding="utf-8")

          vm = airlift / "ios-app" / "AppViewModel.swift"
          text = vm.read_text(encoding="utf-8")
          text = text.replace('@Published var selectedTab: AppTab = .pairing',
                              '@Published var selectedTab: AppTab = .walletCards')
          vm.write_text(text, encoding="utf-8")

          text = content.read_text(encoding="utf-8")
          start = text.index('        TabView(selection: $vm.selectedTab) {')
          end = text.index('        .alert("Notice", isPresented: Binding(', start)
          shell = '''        TabView(selection: $vm.selectedTab) {
              WalletCardsTab()
                  .tabItem { Label("Cards", systemImage: "creditcard.fill") }
                  .tag(AppTab.walletCards)

              CommunityView()
                  .tabItem { Label("Community", systemImage: "globe") }
                  .tag(AppTab.community)

              PairingTab()
                  .tabItem { Label("Pairing", systemImage: "antenna.radiowaves.left.and.right") }
                  .tag(AppTab.pairing)

              PasscodeThemeTab()
                  .tabItem { Label("Passcode", systemImage: "lock.circle.fill") }
                  .tag(AppTab.passcodeThemes)

              TendiesView()
                  .tabItem { Label("Wallpapers", systemImage: "photo.stack.fill") }
                  .tag(AppTab.wallpapers)
          }
'''
          text = text[:start] + shell + text[end:]
          text = text.replace(
              '        .sheet(isPresented: $showSupportPopup) {\n            SupportPopupSheet(dontShowOnLaunch: $dontShowSupportOnLaunch)\n        }\n',
              ''
          )
          content.write_text(text, encoding="utf-8")

          info = airlift / "ios-app" / "Info.plist"
          text = info.read_text(encoding="utf-8")
          text = text.replace("<string>AirCard-iOS</string>", "<string>AirCard17</string>")
          info.write_text(text, encoding="utf-8")
          PY

      - name: Build AirCard17 iOS 18-26 IPA
        run: |
          set -euo pipefail
          cd airlift
          xcodebuild \
            -project AirCard-iOS.xcodeproj \
            -scheme AirCard-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_NAME=AirCard17 \
            PRODUCT_BUNDLE_IDENTIFIER=com.siguyyy.aircard17 \
            clean build
          app="$(find build/Build/Products -type d -name '*.app' ! -name '*Tests.app' | head -n 1)"
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName AirCard17' "$app/Info.plist" || true
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry AirCard17-iOS18-26.ipa Payload

      - name: Publish iOS 18-26 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios18-26-airlift
          name: AirCard17 — iOS 18–26 Airlift
          body: |
            Legacy AirCard17 interface with the Airlift backend for iOS 18.0–26.x.
            Import a valid SideStore, AltStore, Jitterbug, or computer pairing file once before Wallet Scan.
            The pairing record is retained in the app. This build does not use kernproc offsets.
          prerelease: false
          make_latest: true
          files: airlift/AirCard17-iOS18-26.ipa
