name: Publish compatibility releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-releases.yml"
      - "AirCard17/**"
      - "AirCard17.xcodeproj/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios17:
    name: Build and publish iOS 17 legacy
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS 17 IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project AirCard17.xcodeproj \
            -scheme AirCard17 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          app="build/Build/Products/Release-iphoneos/AirCard17.app"
          test -d "$app"
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry AirCard17-iOS17.ipa Payload
      - name: Publish iOS 17 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios17-legacy
          name: AirCard17 — iOS 17 Legacy
          body: |
            Last working iOS 17 build. Use this release only on iOS 17.x.
            iOS 18–26 users should install the Airlift pairing build instead.
          prerelease: false
          make_latest: false
          files: AirCard17-iOS17.ipa

  ios26:
    name: Build and publish iOS 18-26 Airlift with legacy UI
    runs-on: macos-15
    steps:
      - name: Check out AirCard17
        uses: actions/checkout@v4
      - name: Check out Airlift backend
        run: git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git airlift
      - name: Overlay legacy AirCard17 UI
        run: |
          python3 .github/legacy_overlay.py
      - name: Build AirCard17 iOS 18-26 IPA
        run: |
          set -euo pipefail
          cd airlift
          xcodebuild \
            -project AirCard-iOS.xcodeproj \
            -scheme AirCard-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_NAME=AirCard17 \
            PRODUCT_BUNDLE_IDENTIFIER=com.siguyyy.aircard17 \
            clean build
          app="$(find build/Build/Products -type d -name '*.app' ! -name '*Tests.app' | head -n 1)"
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName AirCard17' "$app/Info.plist" || true
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry AirCard17-iOS18-26.ipa Payload
      - name: Publish iOS 18-26 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios18-26-airlift
          name: AirCard17 — iOS 18–26 Airlift
          body: |
            Legacy AirCard17 interface with the Airlift backend for iOS 18.0–26.x.
            Import a valid SideStore, AltStore, Jitterbug, or computer pairing file once before Wallet Scan.
            The pairing record is retained in the app. This build does not use kernproc offsets.
          prerelease: false
          make_latest: true
          files: airlift/AirCard17-iOS18-26.ipa
